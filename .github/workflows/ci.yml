name: CI

on:
  push:
    branches: [main, codex/later-custom]
  pull_request:
    branches: [main, codex/later-custom]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # 稳定分支必须验证当前提交，而不是把实时模型目录的新增协议变成随机构建输入。
      # 该工件与Chat Managed Source使用同一Pi v0.84.4来源和Digest。
      - name: Restore pinned model catalog
        env:
          PI_MODEL_DATA_URL: https://github.com/earendil-works/pi/releases/download/v0.84.4/pi-0.84.4-source.tar.gz
          PI_MODEL_DATA_SHA256: ca3958559b60f87ee44c84d94df8c3ee0b7eda575370402abb2d0ad9155cde4a
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/pi-0.84.4-source.tar.gz"
          extract_root="$RUNNER_TEMP/pi-model-data"
          curl --fail --location --retry 3 --output "$archive" "$PI_MODEL_DATA_URL"
          printf '%s  %s\n' "$PI_MODEL_DATA_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$extract_root"
          tar -xzf "$archive" -C "$extract_root"
          test ! -e packages/ai/src/providers/data
          cp -R "$extract_root/pi-0.84.4/packages/ai/src/providers/data" packages/ai/src/providers/data

      - name: Build
        run: npm run build:offline

      - name: Check
        run: npm run check

      - name: Test
        run: npm test
